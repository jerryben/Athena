<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #161b22;
            padding: 16px 24px;
            border-bottom: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #58a6ff;
        }

        .header .status {
            margin-left: auto;
            font-size: 12px;
            color: #8b949e;
        }

        .header .status.online::before {
            content: "●";
            color: #3fb950;
            margin-right: 6px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #1f6feb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #161b22;
            border: 1px solid #30363d;
            border-bottom-left-radius: 4px;
        }

        .message.tool-call {
            align-self: center;
            background: #21262d;
            border: 1px solid #30363d;
            font-size: 12px;
            color: #8b949e;
            max-width: 90%;
        }

        .message.tool-call pre {
            margin-top: 8px;
            background: #0d1117;
            padding: 8px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 11px;
        }

        .input-area {
            background: #161b22;
            padding: 16px 24px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px 48px 12px 16px;
            color: #c9d1d9;
            font-size: 14px;
            resize: none;
            min-height: 48px;
            max-height: 120px;
            font-family: inherit;
        }

        #messageInput:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .voice-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            color: #8b949e;
            transition: all 0.2s;
        }

        .voice-btn:hover {
            color: #58a6ff;
            background: #21262d;
        }

        .voice-btn.recording {
            color: #f85149;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .send-btn {
            background: #1f6feb;
            border: none;
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #388bfd;
        }

        .send-btn:disabled {
            background: #30363d;
            cursor: not-allowed;
        }

        .tools-panel {
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 12px 24px;
            font-size: 12px;
            color: #8b949e;
        }

        .tools-panel h3 {
            color: #c9d1d9;
            margin-bottom: 8px;
        }

        .tools-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tool-tag {
            background: #21262d;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #30363d;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            align-self: flex-start;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #8b949e;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .welcome {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }

        .welcome h2 {
            color: #58a6ff;
            margin-bottom: 16px;
        }

        .welcome p {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 Athena AI</h1>
        <div class="status online" id="statusIndicator">Connected</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome">
            <h2>Welcome to Athena</h2>
            <p>Your personal AI assistant with voice and tools</p>
            <p style="margin-top: 20px; font-size: 12px;">Try: "Check my disk usage", "What's in my Obsidian vault?", "Transcribe this audio"</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="messageInput" placeholder="Type your message or use voice..." rows="1"></textarea>
            <button class="voice-btn" id="voiceBtn" title="Record voice">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>
        <button class="send-btn" id="sendBtn">Send</button>
    </div>

    <div class="tools-panel" id="toolsPanel" style="display: none;">
        <h3>Available Tools</h3>
        <div class="tools-list" id="toolsList"></div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        const toolsPanel = document.getElementById('toolsPanel');
        const toolsList = document.getElementById('toolsList');

        let isRecording = false;
        let mediaRecorder = null;
        let audioChunks = [];

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        });

        // Send on Enter (Shift+Enter for newline)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Voice recording
        voiceBtn.addEventListener('click', toggleRecording);

        async function toggleRecording() {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        uploadAudio(audioBlob);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    voiceBtn.classList.add('recording');
                    voiceBtn.title = 'Stop recording';
                } catch (err) {
                    addMessage('error', 'Microphone access denied. Please allow microphone access.');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                voiceBtn.classList.remove('recording');
                voiceBtn.title = 'Record voice';
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
        }

        async function uploadAudio(audioBlob) {
            addMessage('user', '🎤 Recording...');
            
            const formData = new FormData();
            formData.append('file', audioBlob, 'recording.webm');
            formData.append('language', 'en');

            try {
                const response = await fetch(`${API_BASE}/transcribe`, {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (data.text) {
                    addMessage('user', `🎤 Transcribed: "${data.text}"`);
                    // Auto-send the transcribed text
                    messageInput.value = data.text;
                    sendMessage();
                } else {
                    addMessage('error', `Transcription failed: ${data.error || 'Unknown error'}`);
                }
            } catch (err) {
                addMessage('error', `Transcription error: ${err.message}`);
            }
        }

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            messageInput.value = '';
            messageInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingId = addTypingIndicator();

            try {
                const response = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text }),
                });

                removeTypingIndicator(typingId);

                if (response.ok) {
                    const data = await response.json();
                    addMessage('assistant', data.response || 'No response');
                } else {
                    addMessage('error', `Error: ${response.statusText}`);
                }
            } catch (err) {
                removeTypingIndicator(typingId);
                addMessage('error', `Connection error: ${err.message}`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function addMessage(type, content) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            
            if (type === 'assistant' || type === 'user') {
                msg.textContent = content;
            } else if (type === 'tool-call') {
                msg.innerHTML = `<strong>🔧 Tool Call:</strong><pre>${escapeHtml(JSON.stringify(content, null, 2))}</pre>`;
            } else {
                msg.textContent = content;
            }

            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msg;
        }

        function addTypingIndicator() {
            const id = 'typing-' + Date.now();
            const msg = document.createElement('div');
            msg.id = id;
            msg.className = 'typing-indicator';
            msg.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(msg);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load available tools
        async function loadTools() {
            try {
                const response = await fetch(`${API_BASE}/tools`);
                const data = await response.json();
                
                if (data.tools && data.tools.length > 0) {
                    toolsPanel.style.display = 'block';
                    toolsList.innerHTML = data.tools.map(t => 
                        `<span class="tool-tag">${t.function.name}</span>`
                    ).join('');
                }
            } catch (err) {
                console.log('Could not load tools:', err);
            }
        }

        loadTools();
    </script>
</body>
</html>
