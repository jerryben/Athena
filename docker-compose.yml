services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: athena-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./docker/qdrant:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=athena_key

  postgres:
    image: postgres:17
    container_name: athena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: athena
      POSTGRES_PASSWORD: athena
      POSTGRES_DB: athena
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: athena-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis:/data

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: athena-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - QDRANT_URL=http://qdrant:6333
      - LLM_MODEL=QwenPaw-Flash-4B-Q4_K_M
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
